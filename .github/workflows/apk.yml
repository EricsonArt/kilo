name: APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci && npm run build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk kilo.apk
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk kilo.apk --title "Kilo APK" --notes "Latest Android build. Download kilo.apk and install it." --latest=false
